<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__TITLE__</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&display=swap">
<style>
:root{
  /* The documentary player. Template only: every beat arrives in __DATA__. Light greens and charcoal. */
  --wall:#F3F6F4; --paper:#FBFCFA; --ink:#1D2F33; --ink2:#53686D; --rule:#D3DDD9;
  --hill:#7FAEA5; --hill-d:#4F8A86; --gorse:#EBC94B;
  --display:'Newsreader', Georgia, 'Times New Roman', serif;
  --body:'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--wall);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,p,ol,ul,figure{margin:0}
a{color:var(--ink);text-decoration-color:var(--hill);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:3px}
.skip{position:absolute;left:-999px;top:0;background:var(--paper);padding:8px 12px;z-index:2000}
.skip:focus{left:8px;top:8px}

/* phone first: the stage on top, the story and controls below */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:100vw}
.stage{position:relative;flex:0 0 46%;min-height:200px;background:#DCE6E2}
#map{position:absolute;inset:0}
.stage .badge{position:absolute;left:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:1000;display:flex;gap:8px;align-items:center}
.badge a,.badge span{background:rgba(251,252,250,.92);border:1px solid var(--rule);border-radius:999px;padding:6px 12px;font-size:13px;text-decoration:none}
.photo{position:absolute;inset:0;z-index:900;background:rgba(243,246,244,.96);display:none;align-items:center;justify-content:center;padding:12px}
.photo.on{display:flex}
.photo figure{max-width:100%;max-height:100%;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:8px}
.photo img{display:block;max-width:100%;max-height:calc(100% - 40px);object-fit:contain;border-radius:4px;margin:auto}
.photo figcaption{font-size:13px;color:var(--ink2);padding:6px 2px 0}

.panel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--paper);border-top:1px solid var(--rule);padding:12px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px;color:var(--ink2)}
.chapter{letter-spacing:.09em;text-transform:uppercase;font-weight:500;font-size:12px}
.when{font:300 30px/1 var(--display);color:var(--ink)}
.body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:8px 0}
.caption{font:400 clamp(20px,5.2vw,26px)/1.3 var(--display);transition:opacity .35s}
.caption.out{opacity:0}
details{font-size:14px;margin-top:10px;color:var(--ink2)}
summary{cursor:pointer;padding:6px 0;min-height:32px}
details p{margin:4px 0;overflow-wrap:anywhere}
.bar{position:relative;height:6px;background:var(--rule);border-radius:3px;margin:6px 0 2px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--hill-d)}
.scrub{width:100%;margin:2px 0 8px;accent-color:var(--hill-d);height:28px}
.controls{display:flex;align-items:center;gap:8px}
.btn{appearance:none;border:1px solid var(--ink);background:var(--paper);color:var(--ink);font:500 15px var(--body);min-height:48px;min-width:48px;padding:0 16px;border-radius:999px;cursor:pointer}
.btn:hover{background:var(--ink);color:#fff}
.btn[disabled]{opacity:.35;cursor:default}
.btn.main{background:var(--ink);color:#fff;flex:1}
.btn.main:hover{background:var(--hill-d);border-color:var(--hill-d)}
.mode{font-size:13px;color:var(--ink2);margin-left:auto;white-space:nowrap}
.note{font-size:14px;color:var(--ink2);margin-top:8px}
.foot{font-size:12px;color:var(--ink2);margin-top:6px}

/* desktop: the stage beside the story */
@media (min-width:900px){
  .app{flex-direction:row}
  .stage{flex:1 1 auto}
  .panel{flex:0 0 min(440px,38vw);border-top:0;border-left:1px solid var(--rule);padding-top:24px}
  .when{font-size:44px}
  .caption{font-size:28px}
}
.pin{width:18px;height:18px;border-radius:50%;background:var(--hill-d);border:3px solid #fff;box-shadow:0 0 0 2px var(--ink)}
.pin.possible{background:#fff;box-shadow:0 0 0 2px var(--hill-d)}
@media (prefers-reduced-motion:reduce){.caption{transition:none}}
</style>
</head>
<body>
<a class="skip" href="#caption">Skip to the story</a>
<div class="app">
  <section class="stage" aria-label="Map of the townland">
    <div id="map"></div>
    <div class="badge"><a href="../">Donegal Townlands</a><span id="place">__BRAND__</span></div>
    <div class="photo" id="photo"><figure><img id="photoimg" alt=""><figcaption id="photocap"></figcaption></figure></div>
  </section>
  <section class="panel" aria-label="The story">
    <div class="meta"><span class="chapter" id="chapter"></span><span id="count"></span></div>
    <h1 class="when" id="when"></h1>
    <div class="body">
      <p class="caption" id="caption" aria-live="polite" tabindex="-1"></p>
      <details id="rec"><summary>The records behind this</summary><div id="recbody"></div></details>
      <p class="note" id="thin" hidden></p>
    </div>
    <div class="bar" aria-hidden="true"><i id="fill"></i></div>
    <input class="scrub" id="scrub" type="range" min="0" value="0" step="1" aria-label="Move to a point in the story">
    <div class="controls">
      <button class="btn" id="prev" type="button" aria-label="Previous">&#8592;</button>
      <button class="btn main" id="play" type="button">Watch</button>
      <button class="btn" id="next" type="button" aria-label="Next">&#8594;</button>
      <span class="mode" id="mode">Explore</span>
    </div>
    <p class="foot" id="foot"></p>
  </section>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var D=__DATA__;
(function(){
  var $=function(id){return document.getElementById(id)};
  var beats=[], chapters={};
  D.chapters.forEach(function(c){chapters[c.id]=c.title; c.beats.forEach(function(b){beats.push(b)})});
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  var ZOOM={parish:13,townland:15,household:17};
  var i=0, playing=false, timer=null, started=0, remaining=0, raf=0, map=null, pin=null;

  function el(tag,cls,text){var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e}

  /* the map is optional: without Leaflet or a network the story still plays */
  if(!window.L){var nm=el('p','note','The map could not load. The story still plays.'); nm.style.cssText='position:absolute;left:12px;bottom:12px;right:12px;margin:0'; $('map').append(nm)}
  if(window.L){
    map=L.map('map',{zoomControl:true,attributionControl:true,zoomAnimation:!reduce,fadeAnimation:!reduce,tap:true});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
    var b0=beats[0]; map.setView([b0.place.lat,b0.place.lon],ZOOM[b0.place.camera]||14);
    map.on('dragstart zoomstart',function(e){ if(!e.flying) {} });
    ['mousedown','touchstart'].forEach(function(t){$('map').addEventListener(t,function(){pause()},{passive:true})});
  }

  function camera(b){
    if(!map) return;
    var ll=[b.place.lat,b.place.lon], z=ZOOM[b.place.camera]||14;
    if(pin) map.removeLayer(pin);
    pin=L.marker(ll,{keyboard:false,interactive:false,icon:L.divIcon({className:'',html:'<div class="pin'+(b.evidence.certainty==='possible'?' possible':'')+'"></div>',iconSize:[18,18],iconAnchor:[9,9]})}).addTo(map);
    if(reduce) map.setView(ll,z,{animate:false}); else map.flyTo(ll,z,{duration:1.6});
  }

  function photo(b){
    var p=$('photo'); var f=b.media&&b.media[0];
    if((b.kind==='photo'||b.kind==='title')&&f){
      var m=(D.media||{})[f]||{};
      $('photoimg').src='media/'+f; $('photoimg').alt=m.alt||m.caption||'';
      $('photocap').textContent=(m.caption||'')+(m.source?'. '+m.source+'.':'');
      p.classList.add('on');
    } else p.classList.remove('on');
  }

  function records(b){
    var d=$('recbody'); d.textContent='';
    d.append(el('p',null,'Basis: '+b.evidence.basis.replace(/_/g,' ')+'. '+b.evidence.certainty+'.'));
    b.evidence.events.forEach(function(id){d.append(el('p',null,id))});
  }

  function show(n,fromHash){
    i=Math.max(0,Math.min(beats.length-1,n));
    var b=beats[i], cap=$('caption');
    cap.classList.add('out');
    setTimeout(function(){
      cap.textContent=b.caption; cap.classList.remove('out');
    },reduce?0:160);
    $('when').textContent=b.time.label||D.title;
    $('chapter').textContent=chapters[b.chapter]||'';
    $('count').textContent=(i+1)+' of '+beats.length;
    $('scrub').value=i;
    $('prev').disabled=i===0; $('next').disabled=i===beats.length-1;
    records(b); camera(b); photo(b);
    if(!fromHash){try{history.replaceState(null,'','#beat='+encodeURIComponent(b.id))}catch(e){}}
    $('fill').style.width='0';
  }

  function setMode(){
    $('play').textContent=playing?'Pause':(i>=beats.length-1&&remaining<=0?'Watch again':(started?'Resume':'Watch'));
    $('play').setAttribute('aria-pressed',playing?'true':'false');
    $('mode').textContent=playing?'Watching':'Explore';
  }

  function tick(){
    var b=beats[i], left=remaining-(Date.now()-started);
    $('fill').style.width=Math.min(100,100*(1-left/b.duration_ms))+'%';
    if(playing) raf=requestAnimationFrame(tick);
  }
  function schedule(){
    clearTimeout(timer); cancelAnimationFrame(raf);
    started=Date.now();
    timer=setTimeout(function(){
      if(i>=beats.length-1){playing=false; remaining=0; $('fill').style.width='100%'; setMode(); return}
      show(i+1); remaining=beats[i].duration_ms; schedule();
    },remaining);
    raf=requestAnimationFrame(tick); setMode();
  }
  function play(){
    if(reduce) return;
    if(i>=beats.length-1&&remaining<=0){show(0)}
    if(!remaining||remaining>beats[i].duration_ms) remaining=beats[i].duration_ms;
    playing=true; schedule();
  }
  function pause(){
    if(!playing) return;
    playing=false; clearTimeout(timer); cancelAnimationFrame(raf);
    remaining=Math.max(0,remaining-(Date.now()-started)); setMode();
  }
  function go(n){ /* any move by hand is Explore: stop, then stay where the viewer chose */
    var was=playing; pause(); show(n); remaining=beats[i].duration_ms; started=started||0; setMode();
  }

  $('play').addEventListener('click',function(){playing?pause():play()});
  $('next').addEventListener('click',function(){go(i+1)});
  $('prev').addEventListener('click',function(){go(i-1)});
  $('scrub').max=beats.length-1;
  $('scrub').addEventListener('input',function(){go(parseInt(this.value,10))});
  document.addEventListener('keydown',function(e){
    var t=e.target&&e.target.tagName; if(t==='INPUT'&&e.key!==' '&&e.key!=='Escape') return;
    if(e.key===' '&&t!=='BUTTON'){e.preventDefault(); playing?pause():play()}
    else if(e.key==='ArrowRight'&&t!=='INPUT'){go(i+1)} else if(e.key==='ArrowLeft'&&t!=='INPUT'){go(i-1)}
    else if(e.key==='Escape'){pause()}
  });

  $('foot').textContent=D.foot||'';
  if(D.note){$('thin').hidden=false; $('thin').textContent=D.note}
  if(reduce){$('play').disabled=true; $('play').textContent='Step through'; $('mode').textContent='Explore'}
  var start=0, m=/#beat=([^&]+)/.exec(location.hash||'');
  if(m){var id=decodeURIComponent(m[1]); beats.forEach(function(b,k){if(b.id===id) start=k})}
  show(start,true); remaining=beats[start].duration_ms; setMode();
  if(map) setTimeout(function(){map.invalidateSize()},200);
  window.addEventListener('resize',function(){if(map) map.invalidateSize()});
})();
</script>
</body>
</html>
