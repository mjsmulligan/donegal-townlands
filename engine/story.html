<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Donegal Townlands story</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&display=swap">
<style>
:root{
  /* The story player, one page for every townland. It holds no townland content: the story arrives as docs/data/<slug>.js (or inline, in a test page). Light greens and charcoal. */
  --wall:#F3F6F4; --paper:#FBFCFA; --ink:#1D2F33; --ink2:#53686D; --rule:#D3DDD9;
  --hill:#7FAEA5; --hill-d:#4F8A86; --gorse:#EBC94B;
  --display:'Newsreader', Georgia, 'Times New Roman', serif;
  --body:'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --ease:cubic-bezier(.22,.8,.24,1);
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--wall);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,p,ol,ul,figure{margin:0}
a{color:var(--ink);text-decoration-color:var(--hill);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:3px}
.skip{position:absolute;left:-999px;top:0;background:var(--paper);padding:8px 12px;z-index:2000}
.skip:focus{left:8px;top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* the backdrop is a satellite view of the townland, full bleed, under a pale wash. If the map cannot load, the first photograph or plain colour stands in. */
.bg{position:fixed;inset:0;z-index:-1;background:transparent;overflow:hidden}
.bg.photo{background:var(--wall)}
.bg.photo::before{content:"";position:absolute;inset:-4%;background:var(--photo) center/cover no-repeat;animation:drift 70s ease-in-out infinite alternate}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(243,246,244,.50) 0%,rgba(243,246,244,.26) 40%,rgba(243,246,244,.70) 100%);transition:opacity 1s}
.app.hero ~ .bg::after{opacity:.4}
body.introing .app,body.introing .bg{opacity:0}
.app,.bg{transition:opacity 1.6s}
@keyframes drift{from{transform:scale(1.02) translate3d(-1.2%,0,0)}to{transform:scale(1.08) translate3d(1.2%,-.8%,0)}}

.app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:calc(8px + env(safe-area-inset-top,0px)) 10px calc(8px + env(safe-area-inset-bottom,0px));gap:8px}
.top{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.top .replay{background:rgba(251,252,250,.88);border:1px solid var(--rule);border-radius:999px;padding:5px 12px;font:400 13px var(--body);color:var(--ink);cursor:pointer;min-height:32px}
.top a,.top span{background:rgba(251,252,250,.88);border:1px solid var(--rule);border-radius:999px;padding:5px 12px;font-size:13px;text-decoration:none;backdrop-filter:blur(6px)}

/* the stage is a window that opens for a photograph or the people dots, and closes for the opening, the end and any moment with neither */
.stage{position:relative;flex:0 0 34%;min-height:0;border-radius:16px;overflow:hidden;background:rgba(251,252,250,.9);border:1px solid var(--rule);transition:flex-basis .9s var(--ease),opacity .6s,margin .9s var(--ease)}
.app.pic .stage{flex-basis:46%}
.app.hero .stage{flex-basis:0;opacity:0;border-width:0;margin-top:-8px;pointer-events:none;visibility:hidden;transition:flex-basis .9s var(--ease),opacity .6s,margin .9s var(--ease),visibility 0s .9s}
.photo{position:absolute;inset:0;z-index:900;background:rgba(243,246,244,.97);display:flex;align-items:center;justify-content:center;padding:10px;opacity:0;pointer-events:none;transition:opacity .9s}
.photo.on{opacity:1}
.photo figure{width:100%;height:100%;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:8px}
.photo figure>*{transition:opacity .7s}
.photo.swap figure>*{opacity:0}
.photo img{display:block;flex:1 1 auto;min-height:0;width:100%;object-fit:contain;border-radius:4px}
/* record forms: a page pager, a zoom button and the credit line under the image. Only these take taps. */
.pbar{display:flex;align-items:center;justify-content:center;gap:8px;padding-top:6px;flex-wrap:wrap}
.pbar[hidden],.pcredit[hidden],.pbar [hidden]{display:none}
.pbtn{appearance:none;border:1px solid var(--ink);background:var(--paper);color:var(--ink);font:500 15px var(--body);min-height:44px;min-width:44px;padding:0 14px;border-radius:999px;cursor:pointer}
.pbtn:disabled{opacity:.35;cursor:default}
#pnum{font-size:13px;color:var(--ink2);min-width:84px;text-align:center}
.pcredit{font-size:11px;color:var(--ink2);text-align:center;padding-top:4px}
.linkbtn{appearance:none;border:0;background:none;color:var(--ink);font:inherit;text-decoration:underline;cursor:pointer;padding:6px 4px}
.photo.on .pctl,.photo.on a.zoomable{pointer-events:auto}
a.zoomable{cursor:zoom-in}
/* the zoom view: the form at its own size, scrolled to the names, and panned by hand */
.zoom{position:fixed;inset:0;z-index:2600;background:rgba(29,47,51,.92);display:flex;flex-direction:column}
.zoom[hidden]{display:none}
.zbar{display:flex;align-items:center;gap:12px;padding:10px 12px;color:#fff;font-size:14px}
.zbar span{flex:1 1 auto;min-width:0}
.zscroll{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;background:#0e2a36}
.zscroll img{display:block;max-width:none;width:auto;min-width:1200px}
.credit{font-size:14px;margin:0 0 12px}
.credit a{overflow-wrap:anywhere}

/* the people: one dot for every person counted */
.dots{position:absolute;inset:0;z-index:850;background:rgba(243,246,244,.86);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;padding:10px 12px 12px;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .9s}
.dots.on{opacity:1}
.dotrow{margin:auto 0}
.app.pic .dots{padding-bottom:28px}
.dotgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;max-width:min(100%,430px)}
.dotgrid i{width:11px;height:11px;border-radius:50%;background:var(--hill-d);transform:scale(0);opacity:0;transition:transform .5s var(--ease),opacity .5s,background .5s}
.dotgrid i.on{transform:none;opacity:1}
.dotgrid i.off{transform:scale(.8);opacity:.5;background:transparent;box-shadow:inset 0 0 0 2px var(--hill-d)}
.dotnum{font:300 clamp(40px,11vw,64px)/1 var(--display);font-variant-numeric:tabular-nums}
.dotnum small{font:400 15px var(--body);color:var(--ink2);margin-left:8px}
.dotrow{display:none;align-items:flex-start;justify-content:center;gap:clamp(8px,3vw,22px);width:100%;max-width:560px}
.dots.multi .dotrow{display:flex}
.dots.multi>.dotnum,.dots.multi>.dotgrid{display:none}
.dotcol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.dotyear{font:600 13px var(--body);letter-spacing:.06em;color:var(--ink2)}
.dotcol b{font:300 clamp(22px,6.5vw,30px)/1 var(--display);font-variant-numeric:tabular-nums}
.dotcol small{font:400 11px/1.25 var(--body);color:var(--ink2);text-align:center}
.dotcol .dotgrid{display:flex;gap:3px;max-width:100%}
.dotcol .dotgrid i{width:6px;height:6px}
/* a return with its households: every dot one colour, the head of each household a larger, darker dot that starts
   the household. Nothing here links a household in one year to the same one in another. */
.dotcol .dotgrid.byhh{display:block;text-align:center;line-height:0;font-size:0}
.dotcol .dotgrid.byhh i{display:inline-block;width:6px;height:6px;margin:1px .5px;vertical-align:middle;background:var(--hill)}
.dotcol .dotgrid.byhh i.hd{width:8px;height:8px;margin-left:8px;background:var(--ink)}
.dotcol .dotgrid.byhh i.hd:first-child{margin-left:.5px}
.hh{display:inline;border-radius:6px;cursor:pointer;transition:opacity .3s}
.dotgrid.pick .hh{opacity:.28}.dotgrid.pick .hh.sel{opacity:1}
.dots.on .dotgrid.byhh .hh{pointer-events:auto}
.dotmore{appearance:none;flex:0 0 auto;border:0;background:none;color:var(--ink2);font:500 13px var(--body);min-height:40px;padding:0 14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.dotmore[hidden]{display:none}
.dots.on .dotmore{pointer-events:auto}
/* where you are among the stage's pages: the dots, then each form */
.pips{position:absolute;left:0;right:0;bottom:6px;z-index:960;display:flex;justify-content:center;gap:7px;pointer-events:none}
.pips[hidden]{display:none}
.pips b{width:8px;height:8px;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink2)}
.pips b.on{background:var(--ink2)}

/* a transcription: the lines of an estate sheet or rental, as written */
.sheet{position:absolute;inset:0;z-index:880;background:rgba(243,246,244,.97);display:flex;flex-direction:column;padding:10px;opacity:0;pointer-events:none;transition:opacity .9s}
.sheet.on{opacity:1}
.sheet .sbox{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:8px 10px}
.sheet h3{margin:0 0 6px;font:600 14px var(--body);color:var(--ink)}
.sheet .sscroll{flex:1 1 auto;min-height:0;overflow:auto}
.sheet.on .sscroll{pointer-events:auto}
.sheet table{width:100%;border-collapse:collapse;font-size:13px}
.sheet th{text-align:left;font:600 11px var(--body);letter-spacing:.05em;color:var(--ink2);padding:2px 6px 4px;border-bottom:1px solid var(--rule)}
.sheet td{padding:3px 6px;border-bottom:1px solid var(--rule);vertical-align:top}
.sheet td.r{font-variant-numeric:tabular-nums;white-space:nowrap}
.sheet .scredit{margin:6px 0 0;font-size:11px;color:var(--ink2)}

/* cards travel along a track; the one in view is clear, the ones either side wait in the haze */
.cards{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;display:flex;align-items:center;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 6%,#000 94%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 6%,#000 94%,transparent 100%)}
.track{display:flex;gap:14px;align-items:center;height:100%;will-change:transform;transition:transform 1.2s var(--ease)}
.card{flex:0 0 min(86vw,420px);max-height:100%;overflow:auto;background:rgba(251,252,250,.9);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;backdrop-filter:blur(8px);opacity:.28;transform:scale(.93);transition:opacity .7s,transform 1.2s var(--ease)}
/* a moment dims quickly as it leaves and the next rises after a short pause, so the change reads as a dissolve */
.card.cur{opacity:1;transform:none;transition:opacity 1.5s .5s,transform 1.2s var(--ease)}
.card .ch{font:500 12px var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.card .when{font:300 34px/1.05 var(--display);margin:2px 0 8px}
.card .caption{font:400 clamp(19px,5vw,24px)/1.32 var(--display)}
.card details{font-size:14px;margin-top:10px;color:var(--ink2)}
summary{cursor:pointer;padding:6px 0;min-height:32px}
details p{margin:4px 0;overflow-wrap:anywhere}

/* the ribbon is the clock: a year that runs forward between moments, and every moment a stop along it */
.ribbon{position:relative;flex:0 0 auto;height:74px;margin:0 6px;touch-action:pan-y}
.ribbon .line{position:absolute;left:0;right:0;top:34px;height:3px;background:rgba(83,104,109,.35);border-radius:2px}
.ribbon .done{position:absolute;left:0;top:34px;height:3px;background:var(--hill-d);border-radius:2px;width:0}
.stop[hidden],.lab[hidden]{display:none!important}
.stop{position:absolute;top:26px;width:20px;height:20px;margin-left:-10px;border-radius:50%;border:3px solid var(--wall);background:var(--ink2);padding:0;cursor:pointer;transition:transform .4s var(--ease),background .4s}
.stop.past{background:var(--hill-d)}
.stop.cur{transform:scale(1.35);background:var(--gorse);box-shadow:0 0 0 2px var(--ink)}
.stop.possible{background:var(--paper);box-shadow:0 0 0 2px var(--hill-d)}
.stop:before{content:"";position:absolute;inset:-12px}
.lab{position:absolute;top:50px;transform:translateX(-50%);font-size:12px;color:var(--ink);white-space:nowrap;background:rgba(251,252,250,.85);border-radius:999px;padding:0 7px}
.head{position:absolute;top:0;transform:translateX(-50%);font:300 26px/1 var(--display);background:rgba(251,252,250,.92);border:1px solid var(--rule);border-radius:999px;padding:3px 14px 4px;pointer-events:none;font-variant-numeric:tabular-nums}
.head:after{content:"";position:absolute;left:50%;top:100%;width:2px;height:8px;background:var(--ink);transform:translateX(-50%)}

.controls{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.btn{appearance:none;border:1px solid var(--ink);background:rgba(251,252,250,.92);color:var(--ink);font:500 15px var(--body);min-height:48px;min-width:48px;padding:0 16px;border-radius:999px;cursor:pointer}
.btn:hover{background:var(--ink);color:#fff}
.btn[disabled]{opacity:.35;cursor:default}
.btn.main{background:var(--ink);color:#fff;flex:1}
.btn.main:hover{background:var(--hill-d);border-color:var(--hill-d)}
.mode{font-size:13px;color:var(--ink2);margin-left:auto;white-space:nowrap;background:rgba(251,252,250,.88);border-radius:999px;padding:3px 10px}
.note{font-size:14px;color:var(--ink2)}
.btn.explore{font-size:14px;padding:0 14px}
.card .more{margin-top:12px;min-height:44px}
details a{overflow-wrap:anywhere}
/* the explore hub: the families and the record sources this story draws on, each a way back into the story */
.hub{position:fixed;inset:0;z-index:2500;background:rgba(29,47,51,.42);display:flex;align-items:flex-end;justify-content:center;padding:0}
.hub[hidden]{display:none}
.hubbox{width:min(560px,100%);max-height:86dvh;overflow:auto;background:var(--paper);border:1px solid var(--rule);border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.hubbox h2{font:300 30px/1.1 var(--display);margin-bottom:4px}
.hubbox h3{font:500 12px var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);margin:16px 0 8px}
.hubbox .lead{font-size:14px;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid var(--hill-d);background:var(--wall);color:var(--ink);font:500 15px var(--body);min-height:44px;padding:0 16px;border-radius:999px;cursor:pointer;text-align:left}
.chip:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.hubbox .close{margin-top:18px;width:100%}
@media (min-width:900px){.hub{align-items:center}.hubbox{border-radius:16px}}
.controls[hidden],.ribbon[hidden]{display:none}
.foot:empty{display:none}
.foot{font-size:11px;color:var(--ink);flex:0 0 auto;text-align:center;background:rgba(251,252,250,.8);border-radius:999px;padding:1px 10px;align-self:center}
.foot .linkbtn{font-size:11px;padding:6px 2px}

/* the opening: a satellite view that falls from far above Ireland to the townland, then lifts away */
#intro{position:fixed;inset:0;z-index:3000;background:#0e2a36;overflow:hidden}
#intro[hidden]{display:none}
#intro.bgmode{z-index:-2;pointer-events:none;background:var(--wall)}
#intro.bgmode .iname,#intro.bgmode .iskip,#intro.bgmode .leaflet-control-container{display:none}
#intro.bgmode #imap{animation:drift 90s ease-in-out infinite alternate}
#imap{position:absolute;inset:0;background:#0e2a36}
.iname{position:absolute;left:0;right:0;bottom:22%;text-align:center;color:#fff;font:300 clamp(40px,12vw,84px)/1 var(--display);text-shadow:0 2px 18px rgba(0,0,0,.55);opacity:0;transition:opacity 1.6s;pointer-events:none;z-index:1200}
.iname.on{opacity:1}
.iskip{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:1300;background:rgba(14,42,54,.7);color:#fff;border:1px solid rgba(255,255,255,.6);border-radius:999px;min-height:44px;padding:0 20px;font:500 14px var(--body);cursor:pointer}

/* desktop: the window beside the cards, both over the same landscape */
@media (min-width:900px){
  .app{display:grid;grid-template-columns:1fr minmax(380px,460px);grid-template-rows:auto 1fr auto auto auto;gap:12px 16px;padding:16px 18px}
  .top{grid-column:1 / 3}
  .stage{grid-column:1;grid-row:2 / 6;flex-basis:auto}
  .app.hero .stage{display:none}
  .cards{grid-column:2;grid-row:2}
  .ribbon{grid-column:2;grid-row:3}
  .controls{grid-column:2;grid-row:4}
  .foot{grid-column:2;grid-row:5}
  .card{flex-basis:min(400px,100%)}
  .card .when{font-size:44px}
  .card .caption{font-size:26px}
}
/* in the opening and the closing the landscape is the whole picture and the card floats over it */
@media (min-width:900px){
  .app.hero{grid-template-columns:1fr}
  .app.hero .cards,.app.hero .ribbon,.app.hero .controls,.app.hero .foot{grid-column:1;justify-self:center;width:min(560px,100%)}
}
@media (prefers-reduced-motion:reduce){
  .bg{animation:none}.track,.card,.card.cur,.stage,.stop,.photo,.photo figure>*,.dots,.dotgrid i,#intro,.iname,.app,.bg{transition:none}.bg.photo::before,#intro.bgmode #imap{animation:none}
}
</style>
</head>
<body>
<a class="skip" href="#live">Skip to the story</a>
<div class="app hero" id="app">
  <div class="top"><a id="home" href="./">Donegal Townlands</a><span id="place"></span><button class="replay" id="replay" type="button" hidden>Replay opening</button></div>
  <section class="stage" aria-label="Photographs and people">
    <div class="dots" id="dots" aria-hidden="true"><div class="dotnum" id="dotnum"></div><div class="dotgrid" id="dotgrid"></div><div class="dotrow" id="dotrow"></div><button class="dotmore" id="dotmore" type="button" hidden>Census forms &#8250;</button></div>
    <div class="sheet" id="sheet" aria-hidden="true"></div>
    <div class="pips" id="pips" aria-hidden="true" hidden></div>
    <div class="photo" id="photo"><figure><a id="photolink" href="#" target="_blank" rel="noopener" style="display:flex;flex:1 1 auto;min-height:0" title="Open the full size image"><img id="photoimg" alt=""></a>
      <div class="pbar pctl" id="pbar" hidden>
        <button class="pbtn" id="pprev" type="button" aria-label="Previous page">&#8249;</button>
        <span id="pnum" aria-live="polite"></span>
        <button class="pbtn" id="pnext" type="button" aria-label="Next page">&#8250;</button>
        <button class="pbtn" id="pzoom" type="button">Zoom in</button>
      </div>
      <p class="pcredit pctl" id="pcredit" hidden><span id="pcredtext"></span> <button class="linkbtn" id="pcredbtn" type="button">Credits and licences</button></p>
    </figure></div>
  </section>
  <section class="cards" aria-label="The story, in order"><div class="track" id="track"></div></section>
  <div class="ribbon" id="ribbon" role="group" aria-label="Time, from the first moment to the last">
    <div class="line"></div><div class="done" id="done"></div><div id="stops"></div><div class="head" id="head"></div>
  </div>
  <div class="controls">
    <button class="btn" id="prev" type="button" aria-label="Previous">&#8592;</button>
    <button class="btn main" id="play" type="button">Play</button>
    <button class="btn" id="next" type="button" aria-label="Next">&#8594;</button>
    <button class="btn explore" id="explore" type="button" hidden>Explore</button>
    <span class="mode" id="mode">Paused</span>
  </div>
  <p class="foot" id="foot"><span id="footc">Imagery: Esri, Maxar, Earthstar Geographics</span> <button class="linkbtn" id="footbtn" type="button">Credits and licences</button></p>
  <p class="sr" id="live" aria-live="polite" tabindex="-1"></p>
</div>
<div class="hub" id="hub" role="dialog" aria-modal="true" aria-labelledby="hubtitle" hidden>
  <div class="hubbox">
    <h2 id="hubtitle">Explore more</h2>
    <p class="lead">Choose a family or a set of records and the story moves to it.</p>
    <div id="hubfam-box"><h3>Families</h3><div class="chips" id="hubfam"></div></div>
    <div id="hubsrc-box"><h3>Records</h3><div class="chips" id="hubsrc"></div></div>
    <button class="btn close" id="hubclose" type="button">Close</button>
  </div>
</div>
<div class="hub" id="credits" role="dialog" aria-modal="true" aria-labelledby="credtitle" hidden>
  <div class="hubbox">
    <h2 id="credtitle">Credits and licences</h2>
    <div id="credlist"></div>
    <button class="btn close" id="credclose" type="button">Close</button>
  </div>
</div>
<div class="zoom" id="zoom" role="dialog" aria-modal="true" aria-label="Zoomed view of the form" hidden>
  <div class="zbar"><span id="zcap"></span><button class="btn" id="zclose" type="button">Close</button></div>
  <div class="zscroll" id="zscroll" tabindex="0"><img id="zimg" alt=""></div>
</div>
<div class="bg" id="bg" aria-hidden="true"></div>
<div id="intro" hidden aria-hidden="true"><div id="imap"></div><div class="iname" id="iname"></div><button class="iskip" id="iskip" type="button">Skip</button></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!--STORY_DATA-->
<script>
function boot(D,BASE){
  document.title=D.townland+' story';
  document.getElementById('place').textContent=D.townland;
  document.getElementById('home').href=BASE?'./':'../';
  var $=function(id){return document.getElementById(id)};
  var beats=[], chapters={};
  D.chapters.forEach(function(c){chapters[c.id]=c.title; c.beats.forEach(function(b){beats.push(b)})});
  var N=beats.length;
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;

  /* the backdrop and the opening are one map. It sits behind the story, full bleed. On a fresh visit it first

  /* The opening continues the index map. The index hands over the view it was showing (the townland centred, at

  /* an image's address: a shared one (the parish register cover) names its own url, the rest sit in media/ */
  function mpath(f){ var m=(D.media||{})[f]; return (m&&m.url)||BASE+'media/'+f }
  var shownPhoto=null, curFiles=[], pageIdx=0, zoomFrom=null, credFrom=null;
  function fillPhoto(f){
    var m=(D.media||{})[f]||{}, a=$('photolink'), multi=curFiles.length>1, cr=m.credit&&D.credits&&D.credits[m.credit];

  /* sheet: the transcription of an estate sheet or rental, names and rents as written */

  function setMode(){

  /* the clock: stay on a moment for most of its time, then let the years run on to the next one */

    if(reduce) return;
    if(isEnd(i)&&remaining<=0){solo=null; show(0)}
    if(!remaining||remaining>beats[i].duration_ms) remaining=beats[i].duration_ms;
    playing=true; schedule();
  }
  function pause(){
    if(!playing) return;
    playing=false; clearTimeout(timer); clearTimeout(flipTimer); cancelAnimationFrame(raf);
    remaining=Math.max(0,remaining-(Date.now()-started)); setMode();
    setHead(pos[i],year(beats[i]));
  }
  function go(n){ /* any move by hand is Explore: stop, then stay where the viewer chose */
    solo=null; pause(); show(n); remaining=beats[i].duration_ms; setMode();
  }

  var byId={}; beats.forEach(function(b,k){byId[b.id]=k});
  function chips(box,list){
    list.forEach(function(r){
      var c=el('button','chip',r.label); c.type='button';
      c.addEventListener('click',function(){
        closeHub(true); var n=byId[r.beat]; go(n);
        if(r.thread){solo=r.thread}   /* a family plays its own moments, then the hub comes back */
        if(!reduce){remaining=beats[i].duration_ms; play()}
      });
      $(box).append(c);
    });
    $(box+'-box').hidden=!list.length;
  }
  function openHub(){ pause(); hubFrom=document.activeElement; $('hub').hidden=false; $('hubclose').focus() }
  function closeHub(quiet){ $('hub').hidden=true; if(!quiet&&hubFrom&&hubFrom.focus) hubFrom.focus() }
  if(hasHub){
    chips('hubfam',ex.families); chips('hubsrc',ex.sources);
    $('explore').hidden=false; $('explore').addEventListener('click',openHub);
    $('hubclose').addEventListener('click',function(){closeHub()});
    $('hub').addEventListener('click',function(e){ if(e.target===$('hub')) closeHub() });
  }
  $('play').addEventListener('click',function(){playing?pause():play()});
  $('next').addEventListener('click',function(){go(i+1)});
  $('prev').addEventListener('click',function(){go(i-1)});
  document.addEventListener('keydown',function(e){
    var t=e.target&&e.target.tagName;
    if(!$('zoom').hidden||!$('credits').hidden){   /* a dialog is open: Escape closes it, nothing else moves the story */
      if(e.key==='Escape'){ if(!$('zoom').hidden) closeZoom(); else closeCredits() }
      return;
    }
    if(e.key===' '&&t!=='BUTTON'&&t!=='SUMMARY'){e.preventDefault(); playing?pause():play()}
    else if(e.key==='ArrowRight'){go(i+1)} else if(e.key==='ArrowLeft'){go(i-1)}
    else if(e.key==='Escape'){ if(!$('hub').hidden) closeHub(); else pause() }
  });
  /* swipe the cards */
  (function(){var x0=null; var c=$('track').parentNode;
    c.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
    c.addEventListener('touchend',function(e){ if(x0===null) return; var dx=e.changedTouches[0].clientX-x0; x0=null; if(Math.abs(dx)>50) go(i+(dx<0?1:-1)) },{passive:true});
  })();

  if(N<2){$('ribbon').hidden=true; document.querySelector('.controls').hidden=true}   /* nothing to play: the opening, the title card and the note */
  if(reduce){$('play').disabled=true; $('play').textContent='Step through'}
  var start=0, m=/#beat=([^&]+)/.exec(location.hash||'');
  if(m){var id=decodeURIComponent(m[1]); beats.forEach(function(b,k){if(b.id===id) start=k})}
  show(start,true); remaining=beats[start].duration_ms; setMode();
  window.addEventListener('resize',function(){place(true)});
  if(hasMap){$('replay').hidden=false; $('replay').addEventListener('click',function(){go(0); intro(true)})}
  backdrop();
  if(start===0) intro();
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){place(true)});
}
/* One player for every townland. The address is story.html?t=<slug>; the story is docs/data/<slug>.js, which sets
   window.STORY_DATA. A test page may carry the data inline instead. Old docs/<slug>/story.html pages redirect here. */
(function(){
  function fail(t){document.body.insertAdjacentHTML('afterbegin','<p style="font:16px sans-serif;padding:24px">'+t+' <a href="./">Back to the map</a></p>')}
  if(window.STORY_DATA){boot(window.STORY_DATA,''); return}
  var t=new URLSearchParams(location.search).get('t')||'';
  if(!/^[a-z0-9-]+$/.test(t)){fail('No townland chosen.'); return}
  var s=document.createElement('script'); s.src='data/'+t+'.js';
  s.onload=function(){boot(window.STORY_DATA,t+'/')};
  s.onerror=function(){fail('There is no story for this townland yet.')};
  document.head.appendChild(s);
})();
</script>
</body>
