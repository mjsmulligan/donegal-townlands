<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Loughcuill | Donegal Townlands</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&display=swap">
<style>
:root{
  /* Layout concept: a gallery walk. One painted scene per plate, full width, with a museum caption beneath.
     The sky moves from dawn (1850s) through day and late afternoon to dusk (1926) as the plates go on.
     Cottages stand for households. Tables and checklists wait in the archive at the end. */
  --wall:#F3F6F4; --paper:#FBFCFA; --ink:#1D2F33; --ink2:#53686D; --rule:#D3DDD9;
  --hill:#7FAEA5; --hill-d:#4F8A86; --gorse:#EBC94B; --gorse-soft:#F5E8AC; --lough:#C4DAE5;
  --display:'Newsreader', Georgia, 'Times New Roman', serif;
  --body:'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-snap-type:y proximity}
body{margin:0;background:var(--wall);color:var(--ink);font:400 17px/1.6 var(--body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:var(--ink);text-decoration-color:var(--hill);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:3px}
.wrap,.sheet,.plate>*{min-width:0}
.wrap{max-width:1240px;margin-inline:auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:300;margin:0;text-wrap:balance;line-height:1.04;letter-spacing:-.012em}
p{margin:0}
.small{font-size:14px;color:var(--ink2);line-height:1.5}

/* header and hud */
.top{position:fixed;inset:0 0 auto;z-index:40;padding-top:env(safe-area-inset-top,0px);background:linear-gradient(180deg,rgba(243,246,244,.92),rgba(243,246,244,0));pointer-events:none}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px;gap:16px}
.top .brand{font:italic 400 21px var(--display);pointer-events:auto;text-decoration:none}
.top .right{display:flex;align-items:center;gap:14px;pointer-events:auto;min-width:0}
.room-now{font:italic 400 17px var(--display);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{appearance:none;border:1px solid var(--ink);background:rgba(251,252,250,.85);color:var(--ink);font:500 14px var(--body);padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--ink);color:#fff}
.hud{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:4px;background:rgba(251,252,250,.92);border:1px solid var(--rule);border-radius:999px;padding:4px;box-shadow:0 10px 30px rgba(29,47,51,.14);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hud button{appearance:none;border:0;background:transparent;width:40px;height:40px;border-radius:50%;cursor:pointer;color:var(--ink);font-size:20px;line-height:1;display:grid;place-items:center}
.hud button:hover{background:var(--gorse-soft)}
.hud button[disabled]{opacity:.3;cursor:default;background:transparent}
.count{font:500 15px var(--body);min-width:5.4em;text-align:center}
.count i{font-style:normal;color:var(--ink2)}

/* contents drawer */
.drawer{position:fixed;inset:0;z-index:60;background:rgba(29,47,51,.35);display:none}
.drawer.open{display:block}
.drawer-in{position:absolute;right:0;top:0;bottom:0;width:min(440px,100%);background:var(--paper);padding:calc(20px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) 40px 28px;overflow:auto}
.tbl td a{white-space:nowrap}
.drawer h2{font-size:34px;margin-bottom:6px}
.drawer h3{font:italic 400 20px var(--display);color:var(--ink2);margin:26px 0 6px}
.drawer ol{list-style:none;margin:0;padding:0;display:grid;gap:0}
.drawer li a{display:grid;grid-template-columns:2.4em 1fr;gap:6px;padding:7px 4px;text-decoration:none;border-radius:6px;font-size:16px}
.drawer li a:hover{background:var(--gorse-soft)}
.drawer li a b{font-weight:500;color:var(--ink2)}
.drawer .close{float:right}

/* plates */
.plate{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;scroll-snap-align:start;background:var(--wall)}
.art{position:relative;flex:1 1 auto;min-height:clamp(360px,64svh,820px);overflow:hidden}
.art canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.roomtag{position:absolute;left:0;right:0;top:78px;pointer-events:none}
.roomtag p{font:italic 300 clamp(20px,2.6vw,30px) var(--display);color:var(--ink2)}
.roomtag b{font:500 14px var(--body);font-style:normal;color:var(--ink2);margin-right:10px}
.bigtitle{position:absolute;left:0;right:0;top:clamp(120px,22vh,200px);pointer-events:none}
.bigtitle h1{font-size:clamp(76px,17vw,230px);line-height:.88;letter-spacing:-.03em;font-weight:300}
.bigtitle .irish{font:italic 300 clamp(22px,3vw,34px) var(--display);color:var(--hill-d);margin-bottom:10px}
.walkhint{position:absolute;left:0;right:0;bottom:18px;pointer-events:none}
.walkhint p{font-size:14px;color:var(--ink2)}
.label{position:relative;background:var(--paper);border-top:1px solid var(--rule);padding-block:26px 96px}
.lab-grid{display:grid;grid-template-columns:1fr;gap:18px 40px;align-items:start}
.pn{display:block;font:500 14px var(--body);color:var(--ink2);margin-bottom:8px}
.label h2{font-size:clamp(34px,4.4vw,58px)}
.medium{font-size:14px;color:var(--ink2);margin-top:10px;line-height:1.45;max-width:38ch}
.story{font:300 clamp(21px,2.1vw,26px)/1.38 var(--display);max-width:40ch}
.story + .story{margin-top:12px}
.yrs{display:flex;gap:6px;flex-wrap:wrap}
.yr{appearance:none;border:1px solid var(--rule);background:var(--wall);font:500 14px var(--body);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer}
.yr:hover{border-color:var(--ink)}
.yr[aria-selected="true"]{background:var(--gorse-soft);border-color:var(--gorse)}
.yr[disabled]{opacity:.4;cursor:default}
.cnt{font-size:14px;color:var(--ink2);margin-top:10px}
@media (min-width:900px){.lab-grid{grid-template-columns:minmax(220px,1fr) minmax(0,1.5fr) minmax(190px,.8fr)}}
details.rec{margin-top:22px;border-top:1px solid var(--rule);padding-top:14px}
details.rec summary{cursor:pointer;font-weight:500;font-size:15px;list-style:none;display:inline-flex;gap:10px;align-items:center}
details.rec summary::-webkit-details-marker{display:none}
details.rec summary::before{content:"+";display:inline-grid;place-items:center;width:22px;height:22px;border:1px solid var(--ink);border-radius:50%;font-size:15px;line-height:1}
details.rec[open] summary::before{content:"\2212"}
.rec-in{display:grid;gap:26px;grid-template-columns:minmax(0,1fr);margin-top:16px}
@media (min-width:900px){.rec-in{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}}
.rec-txt{display:flex;flex-direction:column;gap:13px;max-width:62ch;font-size:16.5px}
.tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:8px;background:var(--paper);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:600;background:#E6EDE9;position:sticky;top:0}
td.n,th.n{text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}

/* paper sheet (Griffith's) */
.sheetart{display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;padding-inline:14px;padding-block:96px 56px}
.sheet{position:relative;width:min(100%,1040px);background:var(--paper);border:1px solid var(--rule);border-radius:3px;box-shadow:0 30px 70px rgba(29,47,51,.16);padding:clamp(18px,3vw,38px);font-family:var(--display)}
.sheet h3{font:400 clamp(26px,3vw,36px) var(--display);text-align:center;letter-spacing:.01em}
.sheet .sub{text-align:center;font:italic 300 17px var(--display);color:var(--ink2);margin:4px 0 18px}
.sheet .tbl{border:0;border-radius:0;background:transparent}
.sheet table{font:400 15px var(--display);min-width:700px}
.sheet th{background:transparent;font:500 13px var(--body);color:var(--ink2);position:static;border-bottom:1.5px solid var(--ink)}
.sheet td{border-bottom:1px dotted var(--rule)}
.sheet tr.tot td{border-top:1.5px solid var(--ink);border-bottom:0;font-weight:500}
.sheet .foot{margin-top:14px;font:400 14px var(--body);color:var(--ink2);max-width:80ch}

/* empty frames */
.frames{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:22px;width:min(100%,1160px);margin-inline:auto;padding-block:100px 56px}
.frame{aspect-ratio:4/5;border:2px dashed var(--hill-d);border-radius:3px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(251,252,250,.55);gap:4px}
.frame.held{border:2px solid var(--gorse);background:rgba(251,252,250,.85)}
.frame b{font:italic 400 18px/1.15 var(--display)}
.frame span{font-size:13px;color:var(--ink2);line-height:1.35}
.frame em{font-style:normal;font-weight:500;font-size:12px;color:var(--ink)}

/* archive */
.archive{background:var(--paper);border-top:1px solid var(--rule);scroll-snap-align:start;min-height:auto;display:block}
.archive .wrap{padding-block:clamp(64px,9vw,110px) 32px}
.archive h2{font-size:clamp(38px,5vw,64px);margin-bottom:6px}
.archive .pn{margin-bottom:10px}
.archive .intro{max-width:62ch;color:var(--ink2);margin:14px 0 30px}
.q{list-style:none;margin:0;padding:0;display:grid;gap:4px;max-width:72ch}
.q label{display:grid;grid-template-columns:24px 1fr;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;align-items:start}
.q label:hover{background:var(--wall)}
.q input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--hill-d)}
.q input:checked+span{color:var(--ink2);text-decoration:line-through;text-decoration-color:var(--hill)}
.cols{display:grid;gap:40px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.prose{display:flex;flex-direction:column;gap:13px;max-width:62ch}
.rtabs{display:flex;flex-wrap:wrap;gap:6px;margin-block:18px 12px}
.rtab{appearance:none;border:1px solid var(--rule);background:var(--wall);font:500 14px var(--body);padding:7px 14px;border-radius:999px;cursor:pointer;color:var(--ink)}
.rtab[aria-selected="true"]{background:var(--gorse-soft);border-color:var(--gorse)}
.rfilter{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.rfilter input{font:inherit;font-size:15px;padding:8px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--wall);color:var(--ink);min-width:0;width:min(100%,280px)}
.rscroll{max-height:70vh;overflow:auto}
.end{text-align:center;padding-block:46px 130px;font:italic 300 22px var(--display);color:var(--ink2);background:var(--paper)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:13px;line-height:1.35;padding:6px 10px;border-radius:6px;max-width:260px;z-index:70;transform:translate(-50%,-130%)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto;scroll-snap-type:none}}

/* ================= Curated Museum Exhibition Styling ================= */
.fam-plate{scroll-margin-top:54px;border-bottom:1px solid var(--rule)}
.fam-art{min-height:clamp(320px,50svh,620px);background:var(--wall);box-shadow:inset 0 -1px 0 var(--rule)}
.fam-label{padding-block:36px 80px;background:var(--paper)}
.fam-grid{display:grid;grid-template-columns:1fr;gap:28px 48px;align-items:start}
@media (min-width:960px){
  .fam-grid{grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:40px 64px}
}
.fam-header-col{position:sticky;top:80px}
.fam-title{font-size:clamp(36px,4vw,54px);line-height:1.05;margin-bottom:8px}
.fam-timeline-box{margin-top:28px;padding:16px;background:var(--wall);border:1px solid var(--rule);border-radius:8px}
.fam-timeline-label{display:block;font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);margin-bottom:10px}
.fam-story-col{display:flex;flex-direction:column;gap:20px;max-width:68ch}
.fam-lead{font:300 clamp(22px,2.2vw,27px)/1.42 var(--display);color:var(--ink);letter-spacing:-.01em}
.fam-paras-wrap{display:flex;flex-direction:column;gap:16px;border-top:1px solid var(--rule);padding-top:20px}
.fam-para{font:400 17px/1.65 var(--display);color:var(--ink);text-align:justify;text-justify:inter-word}
@media (max-width:640px){.fam-para{text-align:left}}
.vitrine{margin-top:40px;border:1px solid var(--rule);border-radius:8px;background:var(--wall);padding:0;overflow:hidden}
details.vitrine summary{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;background:var(--wall);font-family:var(--body);font-size:14.5px;font-weight:500;user-select:none;transition:background .15s ease}
details.vitrine summary:hover{background:var(--paper)}
details.vitrine summary::-webkit-details-marker{display:none}
details.vitrine summary::before{display:none}
.vitrine-title{display:inline-flex;align-items:center;gap:10px;color:var(--ink)}
.vitrine-title::before{content:"\25B8";font-size:13px;display:inline-block;transition:transform .2s ease}
details.vitrine[open] .vitrine-title::before{transform:rotate(90deg)}
.vitrine-badge{font-size:12px;font-weight:600;color:var(--ink2);background:var(--paper);border:1px solid var(--rule);padding:3px 10px;border-radius:999px}
.vitrine-in{padding:18px;background:var(--paper);border-top:1px solid var(--rule)}
.vitrine-note{font-size:13.5px;color:var(--ink2);margin-bottom:14px;line-height:1.45}

/* photographs: shown whole in a light frame, never cropped (docs/MEDIA_SPEC.md) */
/* With header photos the title plate stacks in the page flow (title, photographs, hint) so they can never overlap on a short screen. */
.art.has-hang{display:flex;flex-direction:column;min-height:clamp(520px,92svh,960px)}
.art.has-hang .bigtitle{position:relative;top:auto;margin-top:clamp(120px,22vh,200px);margin-bottom:clamp(28px,4vw,56px)}
.art.has-hang .walkhint{position:relative;bottom:auto;margin-top:10px;padding-bottom:18px}
.hang{--hh:clamp(170px,32svh,340px);position:relative;height:var(--hh);margin-top:auto;z-index:2;flex:0 0 auto}
.hang-row{display:flex;gap:16px;height:100%;overflow-x:auto;overflow-y:hidden;padding:6px 18px 10px;scroll-snap-type:x proximity;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.hang-row>.hung:first-child{margin-left:auto}
.hang-row>.hung:last-child{margin-right:auto}
.hung{margin:0;flex:0 0 auto;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;height:100%;scroll-snap-align:center}
/* The frame is sized from the photo's shape (--ar, width over height), so the whole picture fits with a small mat and nothing is cropped.
   Picture height is at most the row height less 77px (row padding 16, caption 45, mat 16). On a narrow screen the width is capped and the frame
   shrinks in height to match, so the mat stays even. */
.pframe{appearance:none;display:block;flex:0 0 auto;width:min(calc((var(--hh) - 77px)*var(--ar,1.5) + 16px),calc(100vw - 36px));padding:7px;background:var(--paper);border:1px solid var(--rule);border-radius:2px;box-shadow:0 8px 22px rgba(29,47,51,.2),inset 0 0 0 1px #fff;cursor:zoom-in;font:inherit;color:var(--ink2)}
.pframe img{display:block;width:100%;height:auto;aspect-ratio:var(--ar,1.5);object-fit:contain}
.pframe.broken{cursor:default;padding:14px;font-size:13px}
.hung figcaption{width:0;min-width:100%;max-height:2.6em;margin-top:3px;font-size:12.5px;line-height:1.3;color:var(--ink2);background:rgba(251,252,250,.92);padding:0 8px;border-radius:3px;box-shadow:0 0 0 3px rgba(251,252,250,.92);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
html.lb-lock{overflow:hidden}
.lb{position:fixed;inset:0;z-index:70;display:none;background:var(--wall);overflow:auto}
.lb.open{display:block}
.lb-in{min-height:100%;display:flex;flex-direction:column;gap:12px;padding:max(12px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.lb-bar{display:flex;align-items:center;gap:8px}
.lb-bar .lb-count{font:500 14px var(--body);color:var(--ink2);margin-inline:6px auto}
.lb-bar .btn[disabled]{opacity:.3;cursor:default}
.lb-pic{flex:1 1 auto;display:flex;align-items:center;justify-content:center}
.lb-mat{display:flex;padding:8px;background:var(--paper);border:1px solid var(--rule);box-shadow:0 10px 30px rgba(29,47,51,.18)}
.lb-mat img{display:block;max-width:calc(100vw - 60px);max-height:calc(100svh - 250px);object-fit:contain}
.lb-text{width:min(70ch,100%);margin-inline:auto}
.lb-cap{font:400 20px/1.35 var(--display);color:var(--ink)}
.lb-meta{margin-top:4px}
.lb-link{display:inline-block;margin-top:6px;font-size:15px}
.lb [hidden]{display:none!important}
/* family plate: the Photos tab shows the painted landscape with the photographs hung over it, and no cottages */
.fam-art.has-photos{min-height:clamp(440px,66svh,760px)}
.hang.fam-hang{--hh:clamp(210px,44svh,470px);position:absolute;left:0;right:0;bottom:26px;margin-top:0}
.hang.fam-hang[hidden]{display:none}

/* Phones: single column, larger type, photographs sized by width, and a slim bar for the plate counter that
   sits below the content instead of floating over it. */
@media (max-width:640px){
  body{font-size:18px;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .small,.medium,.cnt,.walkhint p,.treenote,.sheet .foot,.vitrine-note{font-size:16px}
  .pn,.roomtag b,.btn,.yr,.rtab,.lb-bar .lb-count{font-size:16px}
  .btn,.yr,.rtab{padding:9px 16px}
  .top{background:rgba(243,246,244,.97);border-bottom:1px solid var(--rule)}
  .top .brand{font-size:23px}
  .room-now{font-size:17px}
  .count{font-size:17px}
  .hud{left:0;right:0;bottom:0;transform:none;justify-content:center;gap:18px;border-radius:0;border-width:1px 0 0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:rgba(251,252,250,.98);box-shadow:0 -6px 18px rgba(29,47,51,.08)}
  .hud button{width:48px;height:48px;font-size:22px}
  .drawer li a{font-size:18px}
  .drawer h3{font-size:22px}
  .roomtag p{font-size:24px}
  .label h2,.fam-title{font-size:42px}
  .story,.fam-lead{font-size:24px}
  .fam-para{font-size:18.5px}
  .rec-txt{font-size:18px}
  details.rec summary,details.vitrine summary{font-size:17px}
  .vitrine-badge,.fam-timeline-label{font-size:14.5px}
  .vitrine-title::before{font-size:15px}
  table{font-size:15.5px}
  .sheet table{font-size:17px}
  .sheet th{font-size:15px}
  .sheet .sub{font-size:19px}
  .frame b{font-size:20px}
  .frame span{font-size:15px}
  .frame em{font-size:14px}
  .end{font-size:24px}
  .tip{font-size:15px}
  .rfilter input{font-size:16px}
  .label{padding-block:26px 40px}
  .fam-label{padding-block:30px 40px}
  .fam-header-col{position:static}
  /* photographs fill the width, whole and uncropped. A tall photograph is capped near 70% of the screen height. */
  .hang{height:auto}
  .hang-row{height:auto;padding:6px 18px 12px}
  .hung{height:auto}
  .pframe{width:min(calc(100vw - 36px),calc((70svh - 77px)*var(--ar,1.5) + 16px))}
  .hung figcaption{font-size:15px;max-height:2.7em}
  .pframe.broken{font-size:15px}
  .art.has-hang{min-height:0}
  .art.has-hang .bigtitle{margin-top:clamp(120px,22vh,180px);margin-bottom:24px}
  .fam-art.has-photos{display:flex;flex-direction:column;justify-content:flex-end;padding-top:130px;min-height:clamp(440px,calc(70svh + 210px),980px)}
  .hang.fam-hang{position:relative;left:auto;right:auto;bottom:auto;margin:0 0 20px}
  .lb-cap{font-size:22px}
  .lb-link{font-size:17px}

  /* Composition: a shorter painting with the text on a raised card that overlaps its foot, and more room to breathe. */
  .wrap{padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
  .art{min-height:clamp(300px,44svh,420px)}
  .fam-art{min-height:clamp(300px,44svh,420px)}

      thead.append(h('tr',null,[y==='1926'?'Form':'House','Surname','First name','Age','Sex','Relation','Marital or note','Occupation'].map(function(c,i){return h('th',{class:i===3?'n':'',text:c})})));
      rows.forEach(function(r){if(q&&(r.s+' '+r.f).toLowerCase().indexOf(q)<0) return; n++;
        var tr=h('tr',null,[retCell(y,r,String(y==='1926'?r.fo:r.h)),r.s,r.f,r.a==null?'':r.a,r.x,r.r,r.m,r.o].map(function(c,i){return cellNode(c,i===3?'n':'')}));
        tbody.append(tr)});
      cnt.textContent=n+' of '+rows.length+' rows. Spelling as recorded.'+(lk?' The house or form number links to the National Archives image of the original return.':'');
    }
  }
  SRC.forEach(function(sr,i){tabs.append(h('button',{class:'rtab',role:'tab','aria-selected':i===0?'true':'false',onclick:function(){act=i;Array.prototype.forEach.call(tabs.children,function(b,j){b.setAttribute('aria-selected',j===i?'true':'false')});render()}},sr.name))});
  inp.addEventListener('input',render); render();
  return h('section',{class:'plate archive',id:'p'+pad(num)},h('div',{class:'wrap'},h('span',{class:'pn',text:'Plate '+pad(num)}),h('h2',{text:'The records'}),
    h('p',{class:'intro',text:'Every row behind the plates above. Choose a source, then filter by any part of a name.'}),tabs,
    h('div',{class:'rfilter'},h('label',{for:'recFilter',class:'small',text:'Filter by name'}),inp,cnt),
    h('div',{class:'tbl rscroll'},h('table',null,thead,tbody))));
});

/* ================= assemble ================= */
var walk=$('#walk'), els=[];
plates.forEach(function(p,i){
  var el=p.build(i+1); el.setAttribute('data-room',p.room); walk.append(el); els.push(el);
});
walk.append(h('div',{class:'end',text:'End of the walk. '+plates.length+' plates.'}));

/* contents */
var drawer=$('#drawer'), din=$('#drawerIn');
(function(){
  din.append(h('button',{class:'btn close',onclick:function(){drawer.classList.remove('open')}},'Close'),h('h2',{text:'Contents'}),h('p',{class:'small',text:TOWN.name+(SPAN?', '+SPAN+'.':'.')}));
  ROOMS.forEach(function(r,ri){
    var ol=h('ol'); plates.forEach(function(p,i){if(p.room!==ri) return;
      ol.append(h('li',null,h('a',{href:'#p'+pad(i+1),onclick:function(e){e.preventDefault();drawer.classList.remove('open');els[i].scrollIntoView({behavior:reduce?'auto':'smooth'})}},h('b',{text:pad(i+1)}),h('span',{text:p.title}))))});
    if(!ol.children.length) return;
    din.append(h('h3',{text:'Room '+r[0]+'. '+r[1]}),ol);
  });
})();
$('#openC').addEventListener('click',function(){drawer.classList.add('open')});
drawer.addEventListener('click',function(e){if(e.target===drawer) drawer.classList.remove('open')});
document.addEventListener('keydown',function(e){
  if(LB.open){   /* the enlarged photograph owns the keys while it is open */
    if(e.key==='Escape') closePhoto(); else if(e.key==='ArrowRight') stepPhoto(1); else if(e.key==='ArrowLeft') stepPhoto(-1);
    return;
  }
  if(e.key==='Escape') drawer.classList.remove('open');
  var tg=e.target&&e.target.tagName; if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT'||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='ArrowRight') go(1); if(e.key==='ArrowLeft') go(-1);
});

/* hud */
var cur=0;
function setCur(i){cur=i;$('#count').replaceChildren(document.createTextNode(pad(i+1)+' '),h('i',{text:'/ '+pad(plates.length)}));$('#roomNow').textContent='Room '+ROOMS[plates[i].room][0]+'. '+ROOMS[plates[i].room][1];$('#prev').disabled=i===0;$('#next').disabled=i===plates.length-1}
function go(d){var i=Math.max(0,Math.min(plates.length-1,cur+d)); els[i].scrollIntoView({behavior:reduce?'auto':'smooth'})}
$('#prev').addEventListener('click',function(){go(-1)});
$('#next').addEventListener('click',function(){go(1)});
if('IntersectionObserver' in window){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting) setCur(els.indexOf(e.target))})},{rootMargin:'-45% 0px -50% 0px'});
  els.forEach(function(e){io.observe(e)});
}
setCur(0);
if(location.hash&&/^#p\d\d$/.test(location.hash)){var t=document.getElementById(location.hash.slice(1)); if(t) setTimeout(function(){t.scrollIntoView()},50)}
requestAnimationFrame(loop);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){scenes.forEach(function(s){s.dirty=true})});
})();
</script>
</body>
</html>
