*{box-sizing:border-box}

.medium{font-size:14px;color:var(--ink2);margin-top:10px;line-height:1.45;max-width:38ch}

/* Plate 4: treemap */
function squarify(data,x,y,w,hh){
  var res=[], items=data.slice().sort(function(a,b){return b.v-a.v}), total=items.reduce(function(s,d){return s+d.v},0), area=w*hh, row=[];
  items=items.map(function(d){return {d:d,a:d.v/total*area}});
  function worst(r,side){var s=r.reduce(function(t,q){return t+q.a},0),mx=Math.max.apply(null,r.map(function(q){return q.a})),mn=Math.min.apply(null,r.map(function(q){return q.a}));return Math.max(side*side*mx/(s*s),s*s/(side*side*mn))}
  function lay(r){var s=r.reduce(function(t,q){return t+q.a},0);
    if(w>=hh){var rw=s/hh,yy=y;r.forEach(function(q){var rh=q.a/rw;res.push({d:q.d,x:x,y:yy,w:rw,h:rh});yy+=rh});x+=rw;w-=rw}
    else{var rh=s/w,xx=x;r.forEach(function(q){var rw=q.a/rh;res.push({d:q.d,x:xx,y:y,w:rw,h:rh});xx+=rw});y+=rh;hh-=rh}}
  while(items.length){var side=Math.min(w,hh),it=items[0];
    if(!row.length||worst(row.concat([it]),side)<=worst(row,side)){row.push(it);items.shift()}else{lay(row);row=[]}}
  if(row.length) lay(row);
  return res;
}

  art.append(wrapEl);
  var data=GR.filter(function(r){return r.ac}).map(function(r){return {v:r.ac,name:r.names,col:COL[G(surOf(r.occ))]||COL.Other,tip:'Lot '+r.lot+', '+r.area+', valued at £'+r.tot}});
  if(MOUNTAIN) data.push({v:MOUNTAIN,name:PL.treemap.mountain_name,col:'#BDD6CF',tip:PL.treemap.mountain_tip});
  if(WATER) data.push({v:WATER,name:PL.treemap.water_name,col:'#C4DAE5',tip:PL.treemap.water_tip});
  function layout(){
    box.replaceChildren(); var W=box.clientWidth,H=box.clientHeight; if(!W||!H) return;
    squarify(data,0,0,W,H).forEach(function(r){
      var big=r.w>86&&r.h>46;
      box.append(h('div',{class:'tile',title:r.d.name+'. '+r.d.tip,style:{left:r.x+1.5+'px',top:r.y+1.5+'px',width:Math.max(0,r.w-3)+'px',height:Math.max(0,r.h-3)+'px',background:r.d.col+(r.d.col.length===7?'D9':'')}},
        big?[r.d.name,h('span',{text:r.d.v.toFixed(1)+' acres'})]:null));
    });
  }
  if('ResizeObserver' in window) new ResizeObserver(layout).observe(box); else window.addEventListener('resize',layout);
  layout();
  return h('section',{class:'plate',id:'p'+pad(num)},art,labelBlock(pad(num),PL.treemap.title,PL.treemap.medium,PL.treemap.story,null));
});

/* Plates 6 to 19: families */
function famPlate(f){
  plate(1,f.name,function(num){
    var art=h('div',{class:'art'}); var avail={}; YEARS.forEach(function(y){avail[y]=hhFor(y,f.keys).length>0});
    var cur=avail['1901']?'1901':(avail['1926']?'1926':'1850s');
    var sc=makeScene(art,{seed:20+num,ph:PHASE[cur],kind:'hills'});
    var cnt=h('p',{class:'cnt'}), tabs=yearTabs(avail,cur,function(y){pick(y)});
    function pick(y){var list=hhFor(y,f.keys); sc.names=true; sc.setHouses(placeHouses(list,{names:true}),PHASE[y]); setSel(tabs,y); cnt.textContent=countText(y,list,f.keys)}
    var rows=famRows(f.keys);
    var rec=h('details',{class:'rec'},h('summary',{text:'Read the record'}),h('div',{class:'rec-in'},
      h('div',{class:'rec-txt'},f.paras.map(function(p){return h('p',{text:p})})),
      h('div',null,h('p',{class:'small',style:{marginBottom:'8px'},text:rows.length+' rows behind this family'}),table(['Year','House or lot','Name','Age','Relation or role','Marital or note','Valuation'],rows,3))));
    var lab=labelBlock(pad(num),f.name,f.medium,f.story,[tabs,cnt]);
    lab.append(h('div',{class:'wrap'},rec));
    var sec=h('section',{class:'plate',id:'p'+pad(num)},art,lab);
    pick(cur);
    return sec;
  });
}

(function(){
  din.append(h('button',{class:'btn close',onclick:function(){drawer.classList.remove('open')}},'Close'),h('h2',{text:'Contents'}),h('p',{class:'small',text:TOWN.name+(SPAN?', '+SPAN+'.':'.')}));

$('#openC').addEventListener('click',function(){drawer.classList.add('open')});
drawer.addEventListener('click',function(e){if(e.target===drawer) drawer.classList.remove('open')});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape') drawer.classList.remove('open');
  var tg=e.target&&e.target.tagName; if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT'||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='ArrowRight') go(1); if(e.key==='ArrowLeft') go(-1);
});

/* hud */
var cur=0;
function setCur(i){cur=i;$('#count').replaceChildren(document.createTextNode(pad(i+1)+' '),h('i',{text:'/ '+pad(plates.length)}));$('#roomNow').textContent='Room '+ROOMS[plates[i].room][0]+'. '+ROOMS[plates[i].room][1];$('#prev').disabled=i===0;$('#next').disabled=i===plates.length-1}
function go(d){var i=Math.max(0,Math.min(plates.length-1,cur+d)); els[i].scrollIntoView({behavior:reduce?'auto':'smooth'})}
$('#prev').addEventListener('click',function(){go(-1)});
$('#next').addEventListener('click',function(){go(1)});
if('IntersectionObserver' in window){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting) setCur(els.indexOf(e.target))})},{rootMargin:'-45% 0px -50% 0px'});
  els.forEach(function(e){io.observe(e)});
}
setCur(0);
if(location.hash&&/^#p\d\d$/.test(location.hash)){var t=document.getElementById(location.hash.slice(1)); if(t) setTimeout(function(){t.scrollIntoView()},50)}
requestAnimationFrame(loop);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){scenes.forEach(function(s){s.dirty=true})});
})();
