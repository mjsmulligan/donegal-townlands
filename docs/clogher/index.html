<title>Clogher Townland Study</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&display=swap">
<style>
:root{
  /* Layout concept: a gallery walk. One painted scene per plate, full width, with a museum caption beneath.
     The sky moves from dawn (1850s) through day and late afternoon to dusk (1926) as the plates go on.
     Cottages stand for households. Tables and checklists wait in the archive at the end. */
  --wall:#F3F6F4; --paper:#FBFCFA; --ink:#1D2F33; --ink2:#53686D; --rule:#D3DDD9;
  --hill:#7FAEA5; --hill-d:#4F8A86; --gorse:#EBC94B; --gorse-soft:#F5E8AC; --lough:#C4DAE5;
  --display:'Newsreader', Georgia, 'Times New Roman', serif;
  --body:'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-snap-type:y proximity}
body{margin:0;background:var(--wall);color:var(--ink);font:400 17px/1.6 var(--body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:var(--ink);text-decoration-color:var(--hill);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:3px}
.wrap,.sheet,.plate>*{min-width:0}
.wrap{max-width:1240px;margin-inline:auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:300;margin:0;text-wrap:balance;line-height:1.04;letter-spacing:-.012em}
p{margin:0}
.small{font-size:14px;color:var(--ink2);line-height:1.5}

/* header and hud */
.top{position:fixed;inset:0 0 auto;z-index:40;padding-top:env(safe-area-inset-top,0px);background:linear-gradient(180deg,rgba(243,246,244,.92),rgba(243,246,244,0));pointer-events:none}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px;gap:16px}
.top .brand{font:italic 400 21px var(--display);pointer-events:auto;text-decoration:none}
.top .right{display:flex;align-items:center;gap:14px;pointer-events:auto;min-width:0}
.room-now{font:italic 400 17px var(--display);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{appearance:none;border:1px solid var(--ink);background:rgba(251,252,250,.85);color:var(--ink);font:500 14px var(--body);padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--ink);color:#fff}
.hud{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:4px;background:rgba(251,252,250,.92);border:1px solid var(--rule);border-radius:999px;padding:4px;box-shadow:0 10px 30px rgba(29,47,51,.14);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hud button{appearance:none;border:0;background:transparent;width:40px;height:40px;border-radius:50%;cursor:pointer;color:var(--ink);font-size:20px;line-height:1;display:grid;place-items:center}
.hud button:hover{background:var(--gorse-soft)}
.hud button[disabled]{opacity:.3;cursor:default;background:transparent}
.count{font:500 15px var(--body);min-width:5.4em;text-align:center}
.count i{font-style:normal;color:var(--ink2)}

/* contents drawer */
.drawer{position:fixed;inset:0;z-index:60;background:rgba(29,47,51,.35);display:none}
.drawer.open{display:block}
.drawer-in{position:absolute;right:0;top:0;bottom:0;width:min(440px,100%);background:var(--paper);padding:calc(20px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) 40px 28px;overflow:auto}
.drawer h2{font-size:34px;margin-bottom:6px}
.drawer h3{font:italic 400 20px var(--display);color:var(--ink2);margin:26px 0 6px}
.drawer ol{list-style:none;margin:0;padding:0;display:grid;gap:0}
.drawer li a{display:grid;grid-template-columns:2.4em 1fr;gap:6px;padding:7px 4px;text-decoration:none;border-radius:6px;font-size:16px}
.drawer li a:hover{background:var(--gorse-soft)}
.drawer li a b{font-weight:500;color:var(--ink2)}
.drawer .close{float:right}

/* plates */
.plate{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;scroll-snap-align:start;background:var(--wall)}
.art{position:relative;flex:1 1 auto;min-height:clamp(360px,64svh,820px);overflow:hidden}
.art canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.roomtag{position:absolute;left:0;right:0;top:78px;pointer-events:none}
.roomtag p{font:italic 300 clamp(20px,2.6vw,30px) var(--display);color:var(--ink2)}
.roomtag b{font:500 14px var(--body);font-style:normal;color:var(--ink2);margin-right:10px}
.bigtitle{position:absolute;left:0;right:0;top:clamp(120px,22vh,200px);pointer-events:none}
.bigtitle h1{font-size:clamp(76px,17vw,230px);line-height:.88;letter-spacing:-.03em;font-weight:300}
.bigtitle .irish{font:italic 300 clamp(22px,3vw,34px) var(--display);color:var(--hill-d);margin-bottom:10px}
.walkhint{position:absolute;left:0;right:0;bottom:18px;pointer-events:none}
.walkhint p{font-size:14px;color:var(--ink2)}
.label{position:relative;background:var(--paper);border-top:1px solid var(--rule);padding-block:26px 96px}
.lab-grid{display:grid;grid-template-columns:1fr;gap:18px 40px;align-items:start}
.pn{display:block;font:500 14px var(--body);color:var(--ink2);margin-bottom:8px}
.label h2{font-size:clamp(34px,4.4vw,58px)}
.medium{font-size:14px;color:var(--ink2);margin-top:10px;line-height:1.45;max-width:38ch}
.story{font:300 clamp(21px,2.1vw,26px)/1.38 var(--display);max-width:40ch}
.story + .story{margin-top:12px}
.yrs{display:flex;gap:6px;flex-wrap:wrap}
.yr{appearance:none;border:1px solid var(--rule);background:var(--wall);font:500 14px var(--body);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer}
.yr:hover{border-color:var(--ink)}
.yr[aria-selected="true"]{background:var(--gorse-soft);border-color:var(--gorse)}
.yr[disabled]{opacity:.4;cursor:default}
.cnt{font-size:14px;color:var(--ink2);margin-top:10px}
@media (min-width:900px){.lab-grid{grid-template-columns:minmax(220px,1fr) minmax(0,1.5fr) minmax(190px,.8fr)}}
details.rec{margin-top:22px;border-top:1px solid var(--rule);padding-top:14px}
details.rec summary{cursor:pointer;font-weight:500;font-size:15px;list-style:none;display:inline-flex;gap:10px;align-items:center}
details.rec summary::-webkit-details-marker{display:none}
details.rec summary::before{content:"+";display:inline-grid;place-items:center;width:22px;height:22px;border:1px solid var(--ink);border-radius:50%;font-size:15px;line-height:1}
details.rec[open] summary::before{content:"\2212"}
.rec-in{display:grid;gap:26px;grid-template-columns:minmax(0,1fr);margin-top:16px}
@media (min-width:900px){.rec-in{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}}
.rec-txt{display:flex;flex-direction:column;gap:13px;max-width:62ch;font-size:16.5px}
.tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:8px;background:var(--paper);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:600;background:#E6EDE9;position:sticky;top:0}
td.n,th.n{text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}

/* paper sheet (Griffith's) */
.sheetart{display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;padding-inline:14px;padding-block:96px 56px}
.sheet{position:relative;width:min(100%,1040px);background:var(--paper);border:1px solid var(--rule);border-radius:3px;box-shadow:0 30px 70px rgba(29,47,51,.16);padding:clamp(18px,3vw,38px);font-family:var(--display)}
.sheet h3{font:400 clamp(26px,3vw,36px) var(--display);text-align:center;letter-spacing:.01em}
.sheet .sub{text-align:center;font:italic 300 17px var(--display);color:var(--ink2);margin:4px 0 18px}
.sheet .tbl{border:0;border-radius:0;background:transparent}
.sheet table{font:400 15px var(--display);min-width:700px}
.sheet th{background:transparent;font:500 13px var(--body);color:var(--ink2);position:static;border-bottom:1.5px solid var(--ink)}
.sheet td{border-bottom:1px dotted var(--rule)}
.sheet tr.tot td{border-top:1.5px solid var(--ink);border-bottom:0;font-weight:500}
.sheet .foot{margin-top:14px;font:400 14px var(--body);color:var(--ink2);max-width:80ch}

/* treemap */
.treeart{padding-block:92px 40px;display:grid;place-items:center}
.tree{position:relative;width:min(100%,1160px);height:clamp(380px,60svh,640px);margin-inline:auto}
.tile{position:absolute;overflow:hidden;padding:8px 10px;font:italic 400 15px/1.15 var(--display);color:var(--ink);border-radius:3px;display:flex;flex-direction:column;gap:3px}
.tile span{font:500 12px var(--body);font-style:normal;color:rgba(29,47,51,.75)}
.tile:hover{filter:brightness(1.05);outline:2px solid var(--ink);z-index:2}
.treenote{margin-top:12px;font-size:14px;color:var(--ink2)}

/* empty frames */
.frames{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:22px;width:min(100%,1160px);margin-inline:auto;padding-block:100px 56px}
.frame{aspect-ratio:4/5;border:2px dashed var(--hill-d);border-radius:3px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(251,252,250,.55);gap:4px}
.frame.held{border:2px solid var(--gorse);background:rgba(251,252,250,.85)}
.frame b{font:italic 400 18px/1.15 var(--display)}
.frame span{font-size:13px;color:var(--ink2);line-height:1.35}
.frame em{font-style:normal;font-weight:500;font-size:12px;color:var(--ink)}

/* archive */
.archive{background:var(--paper);border-top:1px solid var(--rule);scroll-snap-align:start;min-height:auto;display:block}
.archive .wrap{padding-block:clamp(64px,9vw,110px) 32px}
.archive h2{font-size:clamp(38px,5vw,64px);margin-bottom:6px}
.archive .pn{margin-bottom:10px}
.archive .intro{max-width:62ch;color:var(--ink2);margin:14px 0 30px}
.q{list-style:none;margin:0;padding:0;display:grid;gap:4px;max-width:72ch}
.q label{display:grid;grid-template-columns:24px 1fr;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;align-items:start}
.q label:hover{background:var(--wall)}
.q input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--hill-d)}
.q input:checked+span{color:var(--ink2);text-decoration:line-through;text-decoration-color:var(--hill)}
.cols{display:grid;gap:40px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.prose{display:flex;flex-direction:column;gap:13px;max-width:62ch}
.rtabs{display:flex;flex-wrap:wrap;gap:6px;margin-block:18px 12px}
.rtab{appearance:none;border:1px solid var(--rule);background:var(--wall);font:500 14px var(--body);padding:7px 14px;border-radius:999px;cursor:pointer;color:var(--ink)}
.rtab[aria-selected="true"]{background:var(--gorse-soft);border-color:var(--gorse)}
.rfilter{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.rfilter input{font:inherit;font-size:15px;padding:8px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--wall);color:var(--ink);min-width:0;width:min(100%,280px)}
.rscroll{max-height:70vh;overflow:auto}
.end{text-align:center;padding-block:46px 130px;font:italic 300 22px var(--display);color:var(--ink2);background:var(--paper)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:13px;line-height:1.35;padding:6px 10px;border-radius:6px;max-width:260px;z-index:70;transform:translate(-50%,-130%)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto;scroll-snap-type:none}}
</style>

Charles Meehan","les":"Same","desc":"Land","area":"29 2 25","ac":29.65625,"land":"","bld":"","tot":"2 0 0"}],"water_acres":5.96875,"sheet":{"heading":"CLOGHER","sub":"Parish of Donegal, p. 96. Ord. S. 94 and 95. Areas in acres, roods and perches. Valuations in pounds, shillings and pence.","printed_total":["","Printed total","","","1281 2 35","98 18 0","13 16 0","112 14 0"],"foot":"The valuations add up exactly to the printed total. The areas, with the water entry (lot 55, 5a 3r 35p, no occupier named and no valuation), add up exactly to the printed total, but only if lot 20 reads 0a 1r 20p and lot 3 reads 1a 2r 5p, so those two are the least certain readings. The transcription holds each entry's total valuation only, so the land and buildings columns are blank until the page image is read again. Where several occupiers share a lot, its area is shown once and each occupier's own valuation is listed. Mary Flanagan and Widow Flanagan each appear in three entries and may not be the same person each time. Spellings are as printed."}},"families":[{"keys":["Flanagan"],"name":"The Flanagans","tab":"Flanagan","medium":"Griffith's Valuation and three census returns","story":"The Flanagans were the largest family at Griffith's, with 8 occupiers holding 24 per cent of the townland's valuation, and by 1926 one household remained.","paras":["Seven of the eight Griffith's occupiers held directly from the Earl of Arran. Edward Flanagan held a house and land from Mary Flanagan. Mary and the Widow Flanagan each appear in three entries and Michael in two, so several holdings were already split among people of one name.","In 1901 the Flanagans were the second largest family, behind the Gallaghers by one person, and John Flanigan, 92, was the oldest head in the townland. By 1911 three households remained, headed by men aged 76, 78 and 84. Michael Flanagan, 74 in 1901 and 84 in 1911, is probably the same man. Two more Flanagans lived in other families' houses in 1911: Sarah, 80, an aunt in Patrick Doherty's household (she was 60 and an aunt there in 1901), and Anne, 51, a lodger with Connell O'Donnell.","In 1926 Thomas Flanagan, 60 and single, lives alone. He is the only Flanagan man traced through all three censuses, at 35, 48 and 60. Three Flanagan women, aged 82, 62 and 54, live in the household of John Lynch (form 11). Unity Flanagan, 36 in 1901 and 46 in 1911, is probably the 62-year-old, and Margaret may be the Maggie, 28 and 39, of the earlier censuses."]},{"keys":["Gallagher"],"name":"The Gallaghers","tab":"Gallagher","medium":"Griffith's Valuation and three census returns","story":"The Gallaghers went from 2 occupiers at Griffith's to the largest family in 1901 and 1911, and still numbered 16 in three households in 1926.","paras":["At Griffith's John Gallagher held a house, offices and land of 20a 2r 10p (£3 0s 0d) and shared a mountain lot with Patrick Monaghan. Edward Gallagher held 36a 0r 10p of house, office and land (£3 10s 0d). Together they paid 6 per cent of the townland's valuation.","The family is the best traced in the townland. Edward Gallagher is 57 in 1901, 71 in 1911 and 84 in 1926, and Hugh is 34, 44 and 55. Nine of the 21 Gallaghers of 1911 can be matched in 1926, more than for any other family. A James Gallagher heads a household at 34 in 1901 and at 57 in 1911, but those ages do not fit one man, so there may be two Jameses or an age error.","In 1901 Ellen Gallagher, 26, and her children John (3), Bridget (2) and Edward (under 1) are in the household of Margaret Roper, recorded as her daughter and grandchildren. In 1911 an Ellen, 38, is the wife of Hugh Gallagher, with John 13, Bridget 11, Edward 9 and Hugh 5. Ellen was probably Hugh's wife and was with her mother in 1901. This ties the Gallaghers to the Ropers."]},{"keys":["Hone"],"name":"The Hones","tab":"Hone","medium":"Griffith's Valuation and three census returns","story":"The Hones went from 3 occupiers at Griffith's to 3 households in 1926, when at least 17 people made them the largest family in the townland.","paras":["At Griffith's Francis Hone held 18a 2r 25p of house, office, land and mountain (£2 15s 0d). Patrick Hone and John Hone shared a lot of 423a 2r 36p and 3 roods of land beside it, valued at £4 0s 0d each. Theirs is the largest single lot on the page.","In 1901 the Hones were three households. Patrick Hone, 60, had 9 people with him. Bridget Hone, 60, a widow, and Bridget Hone, 30, who was single and alone, were both recorded as \"Farmer and Seamstress\". By 1911 there were two households, Patrick, then 69, and Michael, 40.","The three heads of 1926 trace back by name and age. Michael is 26 in 1901, 40 in 1911 and 55 in 1926. His namesake Michael is 9, 18 and 33. Joseph is 23 in 1911 and 40 in 1926. A 15-year-old recorded as Henry Kone in Michael Hone's household in 1926 is probably a Hone, which would make the family 18."]},{"keys":["Cassidy"],"name":"The Cassidys","tab":"Cassidy","medium":"Griffith's Valuation and three census returns","story":"The Cassidys had one occupier at Griffith's, John Cassidy, and two households headed by a Hugh Cassidy in every census from 1901 to 1926.","paras":["John Cassidy held 14a 2r 35p of house, office and land (£4 0s 0d) and shared a 2a 2r 15p lot of land with Bryan Moss, valued at £0 13s 0d each. That makes the Cassidys and Mosses co-tenants of one lot in the 1850s.","The two Hughs are traced across all three censuses, aged 45, 54 and 69 and 38, 48 and 66. The family peaked at 15 people in 1911 and then halved. Five Cassidy children traced from 1901 to 1911 (Charles, Anna Maria, Mary, Bella and Bridget) are not found under the same name in 1926, though the daughters may have married.","Other surnames turn up in Cassidy households. In 1901 Robert Pearson, 86, and Mary Pearson, 60, are boarders with the younger Hugh (house 27). In 1911 James McGrath, 79, and Mary McGrath, 80, are the father-in-law and mother-in-law of the Hugh in house 4, and a James McGrath had headed his own household in 1901. In 1926 John Kelly, 37, is in the household of the Hugh in form 13."]},{"keys":["Pearson"],"name":"The Pearsons","tab":"Pearson","medium":"Griffith's Valuation and three census returns","story":"The Pearsons were the only Methodist family in Clogher, with 2 occupiers at Griffith's worth £11 18s 0d, and they shrank from 6 people in 1901 to 3 in 1926.","paras":["Robert Pearson held five lots of house, offices and land, 24a 2r 23p in all (£6 0s 0d). Edward Pearson held 33a 2r 20p (£5 15s 0d) and rented gardens of 35 perches from Bryan Moss (£0 3s 0d). Their combined valuation was second only to the Flanagans', and every Methodist in the three censuses is a Pearson.","In 1901 Edward Pearson, 74, headed a household of four, with Elizabeth (38), Thomas (35) and Adam (28). Robert Pearson, 86, and Mary Pearson, 60, were boarders in Hugh Cassidy's household. In 1911 Adam, 45, headed five people, among them Maggie Jane (30), Edward Thomas (3), Elizabeth (58) and Thomas (54).","In 1926 Margaret Pearson, 46, a widow, heads three people with Edward J (18) and Elizabeth (72). Elizabeth is traced from 1911. Margaret and Edward J are probably Adam's widow Maggie Jane and their son Edward Thomas, but the 1926 record does not say so."]},{"keys":["McGettigan"],"name":"The M'Gettigans","tab":"McGettigan","medium":"Griffith's Valuation and three census returns","story":"The M'Gettigans had 2 occupiers at Griffith's, Sarah and Edward, valued at £4 15s 0d each, and a single household headed by an Edward in 1926.","paras":["Sarah M'Gettigan held three lots of house, offices and land, 11a 1r 15p in all. Edward M'Gettigan held two lots, 11a 3r 10p. Each was valued at £4 15s 0d, and together they paid 8 per cent of the townland's valuation.","In 1901 Patrick McGettigan, 60, \"Wool Waver and Farmer\", lived in house 23 with his wife Cassie (50), son Edward (12) and sister Catherine (55, a seamstress). In house 24 Denis McGettigan, 75, and his wife Katie had a grandson, Barney McGinty, 9. By 1911 neither Patrick nor Denis is recorded. Catherine McGettigan, 77 and single, heads three people, with her sister-in-law Catherine, 62, a widow and sprigger, and her nephew Edward, 23. The widow is probably Cassie of 1901, and the head probably the Catherine of 55, though her age has jumped by 22 years.","Edward McGettigan is traced through all three censuses, at 12, 23 and 37. In 1926 he is married and heads four people with his wife Mary Anne (28) and children Kathleen (5) and James (2)."]},{"keys":["Gildea"],"name":"The Gildeas","tab":"Gildea","medium":"Griffith's Valuation and three census returns","story":"The Gildeas had one occupier at Griffith's, Phelim Gildea, and a household of ten in 1901 that was two brothers by 1926.","paras":["Phelim Gildea shared a lot of house and land, 14a 0r 20p, with Widow M'Ginty, and each was valued at £1 15s 0d.","In 1901 Patrick Gildea, 40, headed ten people: his wife Mary Anne, 39, and eight children from Bridget Maria (18) to Neil, under 1. By 1911 there were eight, with a son Alphonsus, 8, newly recorded and the older children Bridget Maria, Patrick and Edward James gone from the household.","In 1926 the household is Francis Guildea, 34, single, and John Guildea, 26. They match Francis Joseph (9 in 1901, 19 in 1911) and John (2 and 13), both recorded as sons of Patrick Gildea in the earlier censuses. Patrick, Mary Anne and the other children are not found in Clogher in 1926. The spelling has changed from Gildea to Guildea."]},{"keys":["Breslin"],"name":"The Breslins","tab":"Breslin","medium":"Griffith's Valuation and three census returns","story":"The Breslins held steady at 6 or 7 people from 1901 to 1926, moving from one household headed by a married man to two households, one of single siblings and one of a married couple.","paras":["At Griffith's Patrick Breslin shared a lot of 27a 2r 35p with Widow Flanagan and Mary Gillespie, for which he was valued at £4 10s 0d against £2 10s 0d for each of them, and held a 21a 2r 5p mountain lot (£1 0s 0d).","In 1901 Patrick Breslin, 61, headed seven people: his wife Catherine (58), sons Michael (29) and Patrick (26, a widower) and daughters Ellen F, Mary A and Sarah J. By 1911 Michael, 43 and single, is head, with his widowed mother Catherine (71), his brother Patrick (41, a widower) and sisters Hannagh (44), Mary Agnes (27) and Sarah (26).","In 1926 Michael Breslin, 45, single, heads four people with Hanna (47), Mary (32) and Rigana (29), all single. Michael's age is only 2 years above his 1911 age, so one of the two returns is wrong, but the names fit the 1911 siblings. A separate household of two is headed by a married Patrick Breslin, with no age recorded, and his wife Mary, 46. He is probably the widowed brother Patrick of 1911, remarried."]},{"keys":["Moss"],"name":"The Mosses","tab":"Moss","medium":"Griffith's Valuation and two census returns","story":"The Mosses had one occupier at Griffith's, Bryan Moss, valued at £6 13s 0d, and no Moss is recorded in Clogher by 1926.","paras":["Bryan Moss held three lots of house, office and land, 25a 1r 10p in all (£6 0s 0d), shared a 2a 2r 15p land lot with John Cassidy (£0 13s 0d each) and let gardens of 35 perches to Edward Pearson. This is one of only two sub-lettings on the page.","In 1901 Anne Moss, 60, a widow, headed eight people, her seven children being Mich (22), Mary Anne (20), Edward (19), Andrew (17), Bernard (15), Patrick (13) and Maggie (11). By 1911 only Anne, 65, and her daughter Maggie, 20, remain. The other six children are not recorded under the Moss name in Clogher in 1911, and neither Anne nor Maggie is found in 1926."]},{"keys":["Doherty"],"name":"The Dohertys","tab":"Doherty","medium":"Three census returns. Not on Griffith's page","story":"The Dohertys are not among Griffith's occupiers but head a household in all three censuses, ending with a widow, Ellen Doherty, and five single adult children in 1926.","paras":["In 1901 Patrick Doherty, 43, headed ten people: his wife Ellen (40), seven children from Bridget (19) to Mary A and Sarah A (both 4), and Sarah Flanigan, 60, recorded as his aunt. In 1911 he was 56, with Ellen (53), five children and the aunt, now Sarah Flanagan, 80. Bridget (19 in 1901) and John (16) are not in the 1911 household.","In 1926 Ellen Doherty, 69, a widow, heads Patrick (38), Maggie (35), Henry (31), Sarah (29) and Mary (29), all single. Their names and ages fit the five children of 1911 (Patrick 23, Maggie Ellen 20, Henry Joseph 16, Sarah Anne 14 and Mary Agnes 14) fifteen years on. Patrick Doherty the father is not recorded in 1926."]},{"keys":["Roper"],"name":"The Ropers","tab":"Roper","medium":"Three census returns. Not on Griffith's page","story":"The Ropers are not among Griffith's occupiers but grew from 2 people in 1901 to 9 in 1926, when Denis Roper's household of nine was the joint largest in the townland.","paras":["In 1901 Margaret Roper, 60, a widow, headed six people. Two were Ropers, herself and Denis (28), and four were her daughter Ellen Gallagher and Ellen's three children, the link to the Gallaghers described above. By 1911 Denis, 40, is head of a household of five.","In 1926 Denis Roper, 60, is married and heads nine people: his wife Katie (44) and seven children aged 2 to 18, John F, Edward F, Patrick, Maggie, Bridget, Jerry and Mary K. Denis is traced at 28, 40 and 60. The Hugh Gallagher household of the same year also has nine people, and these two are the largest households in Clogher in 1926."]},{"keys":["Other"],"name":"The smaller families","tab":"Other","medium":"Griffith's Valuation and three census returns, for surnames that appear less often","story":"Fifteen further surnames appear in Griffith's or the censuses, and 10 of them are gone by 1926. Only Browne, O'Gara, Lynch, Duggan and Kelly are recorded then.","paras":["M'Ginty. Griffith's occupiers: 1 (Widow, £1 15s 0d). People in 1901, 1911 and 1926: 3, 2 and 0. The Widow shared a house and land lot with Phelim Gildea. Patrick McGinty headed house 15 (71 in 1901, 76 and single in 1911). Barney McGinty, 9, a grandson, was in Denis McGettigan's household in 1901.","M'Nulty. Griffith's occupiers: 1 (Charles, £3 0s 0d). People in 1901, 1911 and 1926: 1, 1 and 0. Hannah McNulty, single, lived alone in house 3 in 1901 (55). In 1911 she is 75 and her sister Mary Breen, 73, is with her.","Breen. Griffith's occupiers: 1 (Mary, £7 5s 0d). People in 1901, 1911 and 1926: 0, 1 and 0. Mary Breen held the highest valuation on the page, with 357a 3r 11p. A Mary Breen, 73, is Hannah McNulty's sister in 1911.","M'Quaid (McQuade). Griffith's occupiers: 1 (Patrick, £3 10s 0d). People in 1901, 1911 and 1926: 1, 1 and 0. Sarah McQuaid, single, 46, headed house 5 in 1901 with a servant, Michael Brown, 21. In 1911 Sarah McQuade is 64, with Michael Browne, 30, as a boarder.","Browne. Griffith's occupiers: 1 (Catherine, £4 15s 0d). People in 1901, 1911 and 1926: 1, 1 and 5. Michael Brown, a servant in 1901 and boarder in 1911, is Michael Browne, 45, a widower heading five people in 1926.","Doogan. Griffith's occupiers: 0. People in 1901, 1911 and 1926: 3, 5 and 0. Unity Doogan headed house 6 in 1901 (60, widow, farmer and seamstress) and house 18 in 1911 (75). In 1911 Cassie Doogan and John Patk Doogan, 10, live with Connell O'Donnell as his daughter and grandson.","McGrath. Griffith's occupiers: 0. People in 1901, 1911 and 1926: 4, 2 and 0. James McGrath headed house 16 with 4 people in 1901. In 1911 James (79) and Mary (80) live with their son-in-law Hugh Cassidy.","O'Donnell. Griffith's occupiers: 0. People in 1901, 1911 and 1926: 3, 2 and 0. Condy O'Donnell, 62, headed house 11 in 1901. Connell ODonnell, 76, a widower, headed house 16 in 1911 with five people, among them a Doogan daughter and grandson and a Flanagan lodger.","O'Gara (Gara). Griffith's occupiers: 0. People in 1901, 1911 and 1926: 0, 4 and 2. James Gara, 50, headed house 19 in 1911 with four people. James O'Gara, 70, married, rd, not only to this transcription. The census page URLs and the Griffith's page link are still to be supplied.","Split each Griffith's valuation into land and buildings. The transcription holds only each entry's total, so those two columns are blank until the page image is re-read."],"plates":{"title":{"title":"An Clochar","irish":"An Clochar","heading":"Clogher","medium":"A townland in Clogher electoral division, Donegal civil parish, Tirhugh barony","story":["An Clochar, in Irish. Clogher lies beside Cullionboy, Meenabrock, Druminnin and Birchhill, among others, and covers 1,277.67 acres (517 ha). Clogher is also the name of the electoral division.","Every scene here is drawn from the records. Cottages stand for households and are not placed on a map."]},"griffiths":{"title":"Twenty-nine names","medium":"Griffith's Valuation, mid 1850s. Printed page, transcribed from an image","story":["One printed page names everyone who held land here. Every holding is let by the Earl of Arran except two sub-lettings: Edward Pearson holds gardens from Bryan Moss, and Edward Flanagan holds a house and land from Mary Flanagan.","The page carries no date. Mid 1850s is the date supplied for this study."]},"treemap":{"title":"Thirty-three holdings, drawn by size","medium":"Griffith's Valuation, mid 1850s. Colour is the holder's family","story":["The whole townland laid out by area, each block coloured by the family of its first-named holder. The Hones' shared holding of 424 acres is the largest block, then Mary Breen's 358 acres, mostly mountain. Every other holding is under 37 acres.","The smallest block, in one corner, is Edward Pearson's gardens of 35 perches, let by Bryan Moss."],"water_name":"Water","water_tip":"Lot 55, 5a 3r 35p, no occupier named"},"not_yet_hung":{"title":"Not yet hung","medium":"Six frames for six kinds of record. Two are filled","story":["The earliest layer is empty. The Tithe Applotment Books, from the 1820s and 1830s, would sit before Griffith's, and for ohn Lynch's household in 1926 appear under Lynch.",{"before":"Area, neighbours and names come from ","link":{"href":"https://www.townlands.ie/donegal/tirhugh/donegal/clogher/clogher/","text":"townlands.ie"},"after":": An Clochar, 1,277.67 acres (517.06 ha), with Barnesyneilly, Croaghnakern, Cullionboy, Meenabrock and Straness to the east and Birchhill, Druminnin, Finnabanes, Finnadoos and Leghawny to the west."},"The Tawnawilly parish register file supplied is only a page index of National Library of Ireland microfilm 04599/04, with no names, so no Clogher baptisms or marriages are included. A blank in the 1901 and 1911 language column is not necessarily English only, so the Irish counts are a minimum. Ages in 1901 are heaped at 60. The 1926 file has no occupation column, records every person as English only, and is missing four ages and two sexes."],"numbers_intro":"Population fell from {n1901} to {n1911} between 1901 and 1911, then to {n1926} by 1926. Everyone with a religion recorded is Roman Catholic except the Pearsons, who are Methodist. Nine surname groups appear in all three censuses."},"records":{"placeholder":"for example Gallagher"}}},"townland":{"name":"Clogher","ded":"Clogher","page_title":"Clogher Townland Study","storage_key":"clogher-q","census_spelling":{"1901":"Clogher","1911":"Clogher","1926":"Clogher"}}};

function squarify(data,x,y,w,hh){
  var res=[], items=data.slice().sort(function(a,b){return b.v-a.v}), total=items.reduce(function(s,d){return s+d.v},0), area=w*hh, row=[];
  items=items.map(function(d){return {d:d,a:d.v/total*area}});
  function worst(r,side){var s=r.reduce(function(t,q){return t+q.a},0),mx=Math.max.apply(null,r.map(function(q){return q.a})),mn=Math.min.apply(null,r.map(function(q){return q.a}));return Math.max(side*side*mx/(s*s),s*s/(side*side*mn))}
  function lay(r){var s=r.reduce(function(t,q){return t+q.a},0);
    if(w>=hh){var rw=s/hh,yy=y;r.forEach(function(q){var rh=q.a/rw;res.push({d:q.d,x:x,y:yy,w:rw,h:rh});yy+=rh});x+=rw;w-=rw}
    else{var rh=s/w,xx=x;r.forEach(function(q){var rw=q.a/rh;res.push({d:q.d,x:xx,y:y,w:rw,h:rh});xx+=rw});y+=rh;hh-=rh}}
  while(items.length){var side=Math.min(w,hh),it=items[0];
    if(!row.length||worst(row.concat([it]),side)<=worst(row,side)){row.push(it);items.shift()}else{lay(row);row=[]}}
  if(row.length) lay(row);
  return res;
}

}
